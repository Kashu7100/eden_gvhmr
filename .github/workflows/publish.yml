name: publish

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored in this repository.
#
# One-time setup on PyPI, before the first release:
#   pypi.org -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name: eden-gvhmr
#     Owner: Kashu7100        Repository: eden_gvhmr
#     Workflow name: publish.yml
#     Environment name: pypi
# Repeat on test.pypi.org with environment `testpypi` to use the dry-run path below.
#
# Then: bump `version` in pyproject.toml, tag it, and publish a GitHub Release. A version number
# on PyPI is permanent — it cannot be reused even after deleting the release — so the tag/version
# agreement is checked before anything is uploaded.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build twine

      - name: Tag must match the project version
        # Only meaningful for a release trigger; a manual TestPyPI run may be off-tag.
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"].lstrip("v")
          print(f"tag={tag!r} pyproject version={version!r}")
          if tag != version:
              sys.exit("Release tag and pyproject version disagree; fix one before publishing.")
          PY
        env:
          TAG: ${{ github.event.release.tag_name }}

      - run: python -m build

      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: upload to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi # add a required reviewer here to gate the irreversible step
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
