[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the importable package is `hmr4d`.
name = "eden-gvhmr"
version = "1.0.0"
description = "GVHMR: World-Grounded Human Motion Recovery via Gravity-View Coordinates (packaged for use as an Eden extension)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zehong Shen and the GVHMR authors (zju3dv)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: `torch`/`torchvision` and `pytorch3d` are intentionally NOT listed here.
# They must match the host CUDA toolkit, so pinning them (e.g. torch==2.3.0+cu121 or
# the pytorch3d +cu121 URL wheel) would break co-installation into an existing GPU env
# such as Eden's. Install them first, matching your CUDA — see docs/INSTALL.md.
dependencies = [
    "pytorch-lightning",   # code imports `pytorch_lightning`
    "hydra-core>=1.3",
    "hydra-zen",
    "hydra-colorlog",
    "omegaconf",
    "numpy",               # unpinned (upstream pinned 1.23.5 — see the chumpy caveat in INSTALL.md)
    "einops",
    "opencv-python",
    "imageio",
    "av",
    "scikit-image",
    "termcolor",
    "rich",
    "joblib",
    "timm",                # HMR2.0a ViT feature extraction
    "smplx",
    "trimesh",
    "chumpy",              # SMPL .pkl loading (needs numpy < 1.24 — see INSTALL.md)
    "ultralytics",         # YOLO tracker
    "cython_bbox",
    "lapx",
]

[project.optional-dependencies]
# DPVO visual odometry (SimpleVO is the default and needs none of these).
dpvo = ["torch-scatter", "numba", "pypose"]
# Extra visualization helpers (pytorch3d, required by the renderer, is a core prereq above).
render = ["wis3d"]
# COLMAP-based SLAM utilities.
slam = ["pycolmap"]
# Everything optional in one go.
full = ["torch-scatter", "numba", "pypose", "wis3d", "pycolmap"]

[project.urls]
Homepage = "https://zju3dv.github.io/gvhmr"
Paper = "https://arxiv.org/abs/2409.06662"
Source = "https://github.com/Kashu7100/eden_gvhmr"
Upstream = "https://github.com/zju3dv/GVHMR"

[project.scripts]
gvhmr-demo = "hmr4d.demo.__main__:main"

[tool.setuptools.packages.find]
include = ["hmr4d*"]

[tool.setuptools.package-data]
# Ship the Hydra config tree and the bundled body-model / dataset resource tensors.
"hmr4d" = ["**/*.yaml", "**/*.pt", "**/*.pth", "**/*.npz", "**/*.npy", "**/*.json", "**/*.txt"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
