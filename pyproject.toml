[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the importable package is `hmr4d`.
name = "eden-gvhmr"
version = "1.1.1"
description = "GVHMR: World-Grounded Human Motion Recovery via Gravity-View Coordinates (packaged for use as an Eden extension)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zehong Shen and the GVHMR authors (zju3dv)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: `torch`/`torchvision` are intentionally NOT listed here. They must match the host CUDA
# toolkit, so pinning them (e.g. torch==2.3.0+cu121) would break co-installation into an existing
# GPU env such as Eden's. Install torch first, matching your CUDA — see docs/INSTALL.md.
#
# `pytorch3d` is NOT required for inference. The rotation helpers it used to provide are vendored
# in `hmr4d/utils/rotation_conversions.py`; only the mesh renderer (`render=True`) still needs the
# real package, which is why it lives in the `render` extra rather than here.
dependencies = [
    "pytorch-lightning",   # code imports `pytorch_lightning`
    # No upper bound. The old `numpy<1.24` came from chumpy 0.70, whose module scope did
    # `from numpy import bool, int, float, ...` — aliases removed in 1.24. The pin was also
    # self-fulfilling: it is what made the resolver choose 0.70. chumpy master (pinned below)
    # dropped that line and imports cleanly under numpy 2. Holding everything else fixed (torch 2.6,
# scipy 1.14.1, ultralytics 8.4.113, av 13, imageio 2.37, timm 1.0.28), stepping numpy across the
# 1.x/2.x boundary (1.26.4 -> 2.2.6) is bit-identical — NEP 50 does not move this pipeline.
    #
    # The remaining numpy constraint comes from *torch*, which declares none of its own: torch
    # < 2.4 is compiled against numpy 1.x and dies at import under numpy 2. Install torch first
    # (docs/INSTALL.md); see "Reproducing the reference numbers" there for the numpy-1 stack.
    "numpy>=1.23",
    "einops",
    "opencv-python<5",     # cv2 5.x is a new major with API changes; unverified here
    # Floors, not pins — pinning made the package uninstallable next to anything modern.
    #
    # The imageio floor is a hard requirement, not a preference: av 14 changed the API its pyav
    # plugin uses, and imageio 2.34.1 against av >= 14 dies in `get_video_lwh` with
    # `AttributeError: 'NoneType' object has no attribute 'numerator'`. 2.37 handles both.
    #
    # The decoder is also part of the numerics: measured one-at-a-time on the tennis clip
    # against the reference pins, av 13 -> 17 shifts body joints by 3.6 deg max, while
    # imageio 2.34 -> 2.37 on its own is bit-identical. Reproducibility, not correctness.
    "imageio>=2.37.0",
    "av>=13.0.0",
    "scikit-image",
    "termcolor",
    "rich",
    "joblib",
    # hmr4d.utils.pylogger imports it directly. It used to arrive via hydra-colorlog; once Hydra
    # moved to the `train` extra a default install lost it, so it must be declared here.
    "colorlog",
    "ffmpeg-python",       # hmr4d.utils.video_io_utils imports `ffmpeg`
    "huggingface-hub",     # gvhmr-download-checkpoints
    # hmr4d.network.hmr2.hmr2 imports `yacs` directly. It was never declared and only resolved
    # because pytorch3d happened to pull it in; now that pytorch3d is optional, it must be here.
    "yacs",
    "tqdm",                # used throughout; previously only arrived transitively
    "smplx",
    "trimesh",
    "cython_bbox",
    # timm is a plain floor: bumping it 0.9.12 -> 1.0.28 alone is bit-identical on the tennis
    # clip, so it does not affect the estimate (an earlier note here blamed it jointly with
    # ultralytics; isolating them showed the detector is the whole effect).
    #
    # ultralytics is the one that moves the result — 8.2.42 -> 8.4.113 alone shifts the tracker
    # boxes by 8.5 px and the body joints by 3.4 deg max. Its floor is nonetheless a hard
    # requirement: 8.2.42 predates torch 2.6 flipping `torch.load` to weights_only=True, so its
    # own loader raises UnpicklingError on yolov8x.pt against any modern torch.
    "timm>=0.9.12",        # HMR2.0a ViT feature extraction
    "ultralytics>=8.4.0",  # YOLO tracker
    "lapx",
    # Imported unconditionally on the demo path, so neither can be an extra:
    "wis3d",               # hmr4d.utils.vis.cv2_utils -> hmr4d.utils.wis3d_utils
    "pycolmap",            # hmr4d.utils.preproc -> relpose.simple_vo (the DEFAULT camera backend)
]

[project.optional-dependencies]
# NOTE: there is deliberately no `reproducible` extra. Reproducing the published numbers means
# going *below* the floors above (ultralytics 8.2.42, numpy 1.23.5), and an extra can only
# narrow a requirement, never relax one — so it could not be satisfied. The legacy stack is a
# documented manual recipe instead; see "Reproducing the reference numbers" in docs/INSTALL.md.
#
# Training: Hydra composes the training configs. Inference builds its model directly (see
# hmr4d.utils.instantiate), so it needs none of this — hmr4d/configs falls back to no-op
# registration when Hydra is absent.
train = ["hydra-core>=1.3", "hydra-zen", "hydra-colorlog", "omegaconf"]
# DPVO visual odometry (SimpleVO is the default and needs none of these).
dpvo = ["torch-scatter", "numba", "pypose"]
# Mesh rendering (`recover(render=True)`). Deliberately empty: both of its requirements have to
# be installed by hand, and neither can be expressed here.
#   * pytorch3d must be built against your exact torch/CUDA (prebuilt wheels cover only a few
#     combinations), so it cannot be pinned;
#   * chumpy is needed to unpickle the SMPL `.pkl` body model, and only the git version imports
#     under numpy >= 1.24 — a direct URL, which PyPI refuses in package metadata.
# See docs/INSTALL.md. Inference needs neither, so a plain `pip install .` pulls no compiled
# dependency and no VCS dependency.
render = []
# Everything optional in one go.
full = ["torch-scatter", "numba", "pypose"]

[project.urls]
Homepage = "https://zju3dv.github.io/gvhmr"
Paper = "https://arxiv.org/abs/2409.06662"
Source = "https://github.com/Kashu7100/eden_gvhmr"
Upstream = "https://github.com/zju3dv/GVHMR"

[project.scripts]
gvhmr-demo = "hmr4d.demo.__main__:main"
gvhmr-download-checkpoints = "hmr4d.download:main"

[tool.uv.extra-build-dependencies]
# chumpy is a render-only manual install (see the `render` extra), but when it is installed with
# uv inside this project its setup.py imports pip/numpy at build time, which PEP 517 build
# isolation does not provide — it fails with `No module named 'pip'`. With plain pip, use
# `--no-build-isolation` instead. See docs/INSTALL.md.
chumpy = ["pip", "setuptools", "wheel", "numpy"]

[tool.setuptools.packages.find]
include = ["hmr4d*"]

[tool.setuptools.package-data]
# Ship the Hydra config tree and the bundled body-model / dataset resource tensors.
"hmr4d" = ["**/*.yaml", "**/*.pt", "**/*.pth", "**/*.npz", "**/*.npy", "**/*.json", "**/*.txt"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
