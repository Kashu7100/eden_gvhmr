[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name; the importable package is `hmr4d`.
name = "eden-gvhmr"
version = "1.0.0"
description = "GVHMR: World-Grounded Human Motion Recovery via Gravity-View Coordinates (packaged for use as an Eden extension)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zehong Shen and the GVHMR authors (zju3dv)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: `torch`/`torchvision` and `pytorch3d` are intentionally NOT listed here.
# They must match the host CUDA toolkit, so pinning them (e.g. torch==2.3.0+cu121 or
# the pytorch3d +cu121 URL wheel) would break co-installation into an existing GPU env
# such as Eden's. Install them first, matching your CUDA — see docs/INSTALL.md.
dependencies = [
    "pytorch-lightning",   # code imports `pytorch_lightning`
    "hydra-core>=1.3",
    "hydra-zen",
    "hydra-colorlog",
    "omegaconf",
    # chumpy imports the numpy scalar aliases (np.bool/int/float/...) removed in numpy 1.24,
    # and torch 2.3 is built against numpy 1.x — so this is a hard upper bound, not a preference.
    "numpy<1.24",
    "einops",
    "opencv-python<5",     # cv2 5.x is a new major with API changes; unverified here
    # The video decoders are part of the numerics: av 17 / imageio 2.37 decode the same mp4 to
    # slightly different pixels than av 13 / imageio 2.34, which moves the YOLO boxes and shifts
    # every downstream stage. Pinning them back made a clean-room env reproduce the reference
    # run bit-for-bit on docs/example_video/tennis.mp4 (max |d| exactly 0).
    "imageio==2.34.1",
    "av==13.0.0",
    "scikit-image",
    "termcolor",
    "rich",
    "joblib",
    "ffmpeg-python",       # hmr4d.utils.video_io_utils imports `ffmpeg`
    "huggingface-hub",     # gvhmr-download-checkpoints
    "smplx",
    "trimesh",
    "chumpy",              # SMPL .pkl loading (needs numpy < 1.24, pinned above)
    "cython_bbox",
    # Results are sensitive to these two: with timm 1.0.28 + ultralytics 8.4.105 the YOLO
    # tracker emits different boxes, which cascades through the ViT crops into the prediction
    # (measured on docs/example_video/tennis.mp4: max |d body_pose| 4.8e-2 rad, |d transl| 3.7 cm).
    # Pinned to upstream's versions so the released checkpoint reproduces its reference behaviour.
    "timm==0.9.12",        # HMR2.0a ViT feature extraction
    "ultralytics==8.2.42", # YOLO tracker
    "lapx",
    # Imported unconditionally on the demo path, so neither can be an extra:
    "wis3d",               # hmr4d.utils.vis.cv2_utils -> hmr4d.utils.wis3d_utils
    "pycolmap",            # hmr4d.utils.preproc -> relpose.simple_vo (the DEFAULT camera backend)
]

[project.optional-dependencies]
# DPVO visual odometry (SimpleVO is the default and needs none of these).
dpvo = ["torch-scatter", "numba", "pypose"]
# Everything optional in one go.
full = ["torch-scatter", "numba", "pypose"]

[project.urls]
Homepage = "https://zju3dv.github.io/gvhmr"
Paper = "https://arxiv.org/abs/2409.06662"
Source = "https://github.com/Kashu7100/eden_gvhmr"
Upstream = "https://github.com/zju3dv/GVHMR"

[project.scripts]
gvhmr-demo = "hmr4d.demo.__main__:main"
gvhmr-download-checkpoints = "hmr4d.download:main"

[tool.setuptools.packages.find]
include = ["hmr4d*"]

[tool.setuptools.package-data]
# Ship the Hydra config tree and the bundled body-model / dataset resource tensors.
"hmr4d" = ["**/*.yaml", "**/*.pt", "**/*.pth", "**/*.npz", "**/*.npy", "**/*.json", "**/*.txt"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''
